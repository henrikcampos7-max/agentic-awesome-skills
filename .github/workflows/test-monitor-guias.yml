name: Monitor de Guias Solus - Tests & CI

on:
  push:
    paths:
      - 'monitor-guias-solus/**'
      - '.github/workflows/test-monitor-guias.yml'
  pull_request:
    paths:
      - 'monitor-guias-solus/**'

jobs:
  test:
    name: Run Pytest & Linting
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'monitor-guias-solus/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r monitor-guias-solus/requirements.txt

      - name: Run Unit Tests with Pytest
        run: |
          cd monitor-guias-solus
          python -m pytest tests/ -v --tb=short
