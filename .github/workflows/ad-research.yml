name: Análise de anúncios e VSLs

on:
  pull_request:
    paths:
      - 'tools/ad-research/**'
      - '.github/workflows/ad-research.yml'
  workflow_call:
    inputs:
      analyzer_ref:
        description: SHA completo do código do analisador no repositório público
        type: string
        required: true
      ai:
        type: boolean
        default: false
      model:
        type: string
        default: gpt-5.4-mini
    secrets:
      AD_RESEARCH_INPUT_URL:
        required: true
      OPENAI_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      ai:
        description: Gerar análise visual e roteiro bilíngue com a API da OpenAI
        type: boolean
        default: false
      model:
        description: Modelo da API usado no modo IA
        type: string
        default: gpt-5.4-mini

permissions:
  contents: read

jobs:
  analyze:
    if: inputs.analyzer_ref != '' || github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: tools/ad-research
        shell: bash
    steps:
      - name: Verificar destino privado e versão fixa
        if: inputs.analyzer_ref != ''
        working-directory: .
        env:
          ANALYZER_REF: ${{ inputs.analyzer_ref }}
          PRIVATE_REPO: ${{ github.event.repository.private }}
        run: |
          if [[ "$PRIVATE_REPO" != "true" || ! "$ANALYZER_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "O pacote privado exige um repositório privado e o SHA completo do código."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.analyzer_ref != '' && 'henrikcampos7-max/agentic-awesome-skills' || github.repository }}
          ref: ${{ inputs.analyzer_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validar importação das métricas
        run: python -m unittest discover -s tests
      - name: Preparar processamento de mídia
        if: github.event_name == 'pull_request' || inputs.analyzer_ref != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr tesseract-ocr-eng espeak-ng fonts-dejavu-core
          python -m pip install --disable-pip-version-check -r requirements-media.txt
      - name: Validar mídia sintética
        if: github.event_name == 'pull_request'
        run: PYTHONPATH=. python tests/check_cloud_media.py
      - name: Analisar referências
        env:
          ANALYZER_REF: ${{ inputs.analyzer_ref }}
          USE_AI: ${{ inputs.ai }}
          AI_MODEL: ${{ inputs.model }}
          AD_RESEARCH_INPUT_URL: ${{ inputs.analyzer_ref != '' && secrets.AD_RESEARCH_INPUT_URL || '' }}
          OPENAI_API_KEY: ${{ inputs.ai && secrets.OPENAI_API_KEY || '' }}
        run: |
          flags=()
          if [[ -n "$ANALYZER_REF" ]]; then flags+=(--cloud-input); fi
          if [[ "$USE_AI" == "true" ]]; then flags+=(--ai --model "$AI_MODEL"); fi
          python -m ad_research "${flags[@]}"
      - name: Publicar resultado no workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: analise-anuncios-vsls
          path: tools/ad-research/result/
          if-no-files-found: error
          retention-days: 14
